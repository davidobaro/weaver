services:
  - type: web
    name: weaver-demo
    runtime: docker
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: WEAVER_MODE
        value: demo
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: NEBIUS_MODEL
        value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
      - key: WEAVER_DEMO_PROVIDER_CALLS
        value: "500"
